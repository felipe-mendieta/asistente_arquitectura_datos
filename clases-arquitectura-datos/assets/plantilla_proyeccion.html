<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITULO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --fondo: #F5F8FC;
  --plano: #FFFFFF;
  --tinta: #1C2733;
  --tinta-suave: #5A6B7D;
  --azul: #2357A6;
  --reticula: #E3EAF3;
  --ambar: #B87A00;
  --rojo: #B83A25;
  --borde: #D5DEE9;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #121A24; --plano: #18222F; --tinta: #E6EDF5; --tinta-suave: #9AAABB;
    --azul: #7FA9E8; --reticula: #1F2B3A; --ambar: #E3B341; --rojo: #EE7B66; --borde: #2A394B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #121A24; --plano: #18222F; --tinta: #E6EDF5; --tinta-suave: #9AAABB;
  --azul: #7FA9E8; --reticula: #1F2B3A; --ambar: #E3B341; --rojo: #EE7B66; --borde: #2A394B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--fondo); color: var(--tinta);
  font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  display: grid; grid-template-columns: 300px 1fr; height: 100%;
}
/* Riel de agenda: altura de cada bloque proporcional a sus minutos */
nav {
  border-right: 1px solid var(--borde); background: var(--plano);
  display: flex; flex-direction: column; padding: 20px 16px; gap: 14px; overflow-y: auto;
}
nav h1 { font-size: 1.05rem; line-height: 1.35; margin: 0; font-weight: 600; }
.reloj-total { font-size: .85rem; color: var(--tinta-suave); }
.riel { display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 360px; }
.bloque {
  all: unset; cursor: pointer; position: relative; border-radius: 4px;
  border-left: 3px solid var(--borde); padding: 6px 10px; overflow: hidden;
  font-size: .85rem; line-height: 1.3; color: var(--tinta-suave);
}
.bloque:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
.bloque .relleno { position: absolute; inset: 0; width: 0; background: var(--reticula); z-index: 0; }
.bloque span { position: relative; z-index: 1; display: block; }
.bloque .min { font-size: .75rem; }
.bloque.activo { border-left-color: var(--azul); color: var(--tinta); font-weight: 500; }
.bloque.sin-tiempo { flex: 0 0 auto !important; }
/* Escenario con retícula tipo plano técnico */
main {
  overflow-y: auto; padding: 40px 6vw 120px;
  background-image:
    linear-gradient(var(--reticula) 1px, transparent 1px),
    linear-gradient(90deg, var(--reticula) 1px, transparent 1px);
  background-size: 32px 32px;
}
.lamina {
  display: none; max-width: 980px; margin: 0 auto; background: var(--plano);
  border: 1px solid var(--borde); border-radius: 6px; padding: 40px 48px;
}
.lamina.visible { display: block; }
.lamina h1, .lamina h2 { font-size: 2rem; line-height: 1.2; margin: 0 0 24px; font-weight: 600; }
.lamina h3 { font-size: 1.3rem; margin: 32px 0 12px; font-weight: 600; color: var(--azul); }
.lamina p, .lamina li { font-size: 1.15rem; line-height: 1.6; max-width: 72ch; }
.lamina table { border-collapse: collapse; margin: 20px 0; font-size: 1rem; display: block; overflow-x: auto; }
.lamina th, .lamina td { border: 1px solid var(--borde); padding: 8px 12px; text-align: left; vertical-align: top; }
.lamina th { background: var(--reticula); font-weight: 600; }
.lamina code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .92em; }
.lamina pre:not(.mermaid) { background: var(--reticula); padding: 14px; border-radius: 4px; overflow-x: auto; }
.lamina pre.mermaid { background: transparent; text-align: center; overflow-x: auto; margin: 28px 0; }
.lamina blockquote { border-left: 3px solid var(--azul); margin: 20px 0; padding: 4px 18px; color: var(--tinta-suave); }
body:not(.ver-docente) .solo-docente { display: none; }
.docente { border: 1px dashed var(--ambar); border-radius: 4px; padding: 12px 18px; margin-top: 24px; }
/* Barra inferior */
footer {
  position: fixed; left: 300px; right: 0; bottom: 0; display: flex; align-items: center; gap: 16px;
  padding: 12px 24px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--plano); border-top: 1px solid var(--borde);
}
footer button {
  font: inherit; font-size: .95rem; padding: 8px 16px; border-radius: 4px;
  border: 1px solid var(--borde); background: var(--plano); color: var(--tinta); cursor: pointer;
}
footer button:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
footer button.primario { background: var(--azul); border-color: var(--azul); color: var(--plano); }
.cronometro { font-variant-numeric: tabular-nums; font-size: 1.6rem; font-weight: 600; min-width: 5ch; }
.cronometro.poco { color: var(--ambar); }
.cronometro.excedido { color: var(--rojo); }
.espacio { flex: 1; }
.posicion { color: var(--tinta-suave); font-size: .9rem; }
@media (max-width: 800px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav { border-right: 0; border-bottom: 1px solid var(--borde); max-height: 30vh; }
  .riel { min-height: 0; }
  .bloque { flex: 0 0 auto !important; }
  footer { left: 0; }
  .lamina { padding: 24px; }
}
@media (prefers-reduced-motion: no-preference) { .bloque .relleno { transition: width .5s linear; } }
</style>
</head>
<body>
<nav aria-label="Agenda de la clase">
  <h1 id="titulo-nav"></h1>
  <div class="reloj-total" id="reloj-total"></div>
  <div class="riel" id="riel"></div>
  <button class="bloque sin-tiempo" id="modo-docente" aria-pressed="false"><span>Mostrar notas del docente</span></button>
</nav>
<main id="escenario"></main>
<footer>
  <button id="anterior" aria-label="Lámina anterior">Anterior</button>
  <button id="siguiente" class="primario" aria-label="Lámina siguiente">Siguiente</button>
  <span class="posicion" id="posicion"></span>
  <span class="espacio"></span>
  <span class="cronometro" id="cronometro" aria-live="off">--:--</span>
  <button id="iniciar">Iniciar bloque</button>
  <button id="reiniciar">Reiniciar</button>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const GUIA_MD = __GUIA_JSON__;

const oscuro = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: oscuro ? "dark" : "neutral", securityLevel: "strict" });

// Divide la guía en láminas: título + ficha/objetivos, y luego una por cada sección H2.
const partes = GUIA_MD.split(/^(?=## )/m);
const laminas = [];
let portada = partes.shift() || "";
partes.forEach(p => {
  const titulo = p.split("\n")[0].replace(/^##\s+/, "").trim();
  const norm = titulo.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const m = titulo.match(/\((\d+)\s*min/);
  const docente = norm.includes("docente") || norm.includes("profundizar");
  if (!m && !docente && laminas.length === 0) { portada += "\n" + p; return; } // ficha, objetivos, agenda
  laminas.push({ titulo, md: p, minutos: m ? +m[1] : 0, docente });
});
laminas.unshift({ titulo: "Inicio", md: portada, minutos: 0, docente: false });

const tituloClase = (portada.match(/^#\s+(.+)$/m) || [, "Clase"])[1];
document.getElementById("titulo-nav").textContent = tituloClase;
const totalMin = laminas.reduce((s, l) => s + l.minutos, 0);
document.getElementById("reloj-total").textContent = `${totalMin} minutos planificados`;

// Renderiza láminas
const escenario = document.getElementById("escenario");
laminas.forEach((l, i) => {
  const el = document.createElement("section");
  el.className = "lamina" + (l.docente ? " docente" : "");
  el.id = "lamina-" + i;
  el.innerHTML = marked.parse(l.md);
  el.querySelectorAll("pre > code.language-mermaid").forEach(code => {
    const pre = document.createElement("pre");
    pre.className = "mermaid";
    pre.textContent = code.textContent;
    code.parentElement.replaceWith(pre);
  });
  // Subsecciones solo para el docente (p. ej. "Solución de referencia (para el docente)"):
  // se agrupan y quedan ocultas en la proyección hasta activar las notas.
  el.querySelectorAll("h3").forEach(h => {
    const n = h.textContent.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    if (!n.includes("docente") && !n.includes("solucion")) return;
    const caja = document.createElement("div");
    caja.className = "docente solo-docente";
    h.before(caja);
    let nodo = h;
    while (nodo && !/^H[1-3]$/.test(nodo.nextElementSibling?.tagName || "H1")) {
      const sig = nodo.nextElementSibling; caja.appendChild(nodo); nodo = sig;
    }
    if (nodo) caja.appendChild(nodo);
  });
  l.el = el;
  escenario.appendChild(el);
});

// Riel de agenda
const riel = document.getElementById("riel");
laminas.forEach((l, i) => {
  const b = document.createElement("button");
  b.className = "bloque" + (l.minutos ? "" : " sin-tiempo");
  b.style.flex = l.minutos ? `${l.minutos} 1 0` : "";
  b.innerHTML = `<div class="relleno"></div><span>${l.titulo.replace(/\s*\(\d+\s*min\)/, "")}</span>` +
                (l.minutos ? `<span class="min">${l.minutos} min</span>` : "");
  b.addEventListener("click", () => mostrar(i));
  if (l.docente) b.hidden = true;
  l.boton = b;
  riel.appendChild(b);
});

// Cronómetro por bloque (estado en memoria; se conserva al cambiar de lámina)
const restante = laminas.map(l => l.minutos * 60);
let actual = 0, intervalo = null;
const crono = document.getElementById("cronometro");
const btnIniciar = document.getElementById("iniciar");

function formato(s) {
  const neg = s < 0, a = Math.abs(s);
  return (neg ? "+" : "") + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0");
}
function pintarCrono() {
  const l = laminas[actual];
  if (!l.minutos) { crono.textContent = "--:--"; crono.className = "cronometro"; btnIniciar.disabled = true; return; }
  btnIniciar.disabled = false;
  const s = restante[actual];
  crono.textContent = formato(s);
  crono.className = "cronometro" + (s < 0 ? " excedido" : s <= 60 ? " poco" : "");
  const usado = Math.min(1, Math.max(0, 1 - s / (l.minutos * 60)));
  l.boton.querySelector(".relleno").style.width = (usado * 100) + "%";
}
function detener() { clearInterval(intervalo); intervalo = null; btnIniciar.textContent = "Iniciar bloque"; }
btnIniciar.addEventListener("click", () => {
  if (intervalo) return detener();
  btnIniciar.textContent = "Pausar";
  intervalo = setInterval(() => { restante[actual]--; pintarCrono(); }, 1000);
});
document.getElementById("reiniciar").addEventListener("click", () => {
  detener(); restante[actual] = laminas[actual].minutos * 60; pintarCrono();
});

let verDocente = false;
document.getElementById("modo-docente").addEventListener("click", e => {
  verDocente = !verDocente;
  e.currentTarget.setAttribute("aria-pressed", verDocente);
  document.body.classList.toggle("ver-docente", verDocente);
  e.currentTarget.querySelector("span").textContent = verDocente ? "Ocultar notas del docente" : "Mostrar notas del docente";
  laminas.forEach(l => { if (l.docente) l.boton.hidden = !verDocente; });
  if (!verDocente && laminas[actual].docente) mostrar(0);
});

function visibles() { return laminas.map((l, i) => i).filter(i => verDocente || !laminas[i].docente); }

async function mostrar(i) {
  if (i !== actual) detener();
  actual = i;
  laminas.forEach((l, j) => {
    l.el.classList.toggle("visible", j === i);
    l.boton.classList.toggle("activo", j === i);
  });
  const v = visibles();
  document.getElementById("posicion").textContent = `${v.indexOf(i) + 1} de ${v.length}`;
  pintarCrono();
  escenario.scrollTop = 0;
  const pendientes = laminas[i].el.querySelectorAll("pre.mermaid:not([data-processed])");
  if (pendientes.length) { try { await mermaid.run({ nodes: pendientes }); } catch (e) { console.error(e); } }
}
function mover(d) { const v = visibles(); const k = v.indexOf(actual) + d; if (k >= 0 && k < v.length) mostrar(v[k]); }
document.getElementById("anterior").addEventListener("click", () => mover(-1));
document.getElementById("siguiente").addEventListener("click", () => mover(1));
document.addEventListener("keydown", e => {
  if (e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (["ArrowRight", "PageDown"].includes(e.key)) mover(1);
  if (["ArrowLeft", "PageUp"].includes(e.key)) mover(-1);
  if (e.key === " ") { e.preventDefault(); btnIniciar.click(); }
});
mostrar(0);
</script>
</body>
</html>
